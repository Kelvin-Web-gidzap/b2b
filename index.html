
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>My Car Parts — B2B Платформа</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Оптовая платформа My Car Parts</h1>
    <p>Личный кабинет, отчеты, печатные формы, экспертная поддержка</p>
    <a href="#form" class="btn">Запросить доступ</a>
  </header>

  <section>
    <h2>Что вы получаете</h2>
    <ul>
      <li>✅ Оптовые цены</li>
      <li>✅ Удобный интерфейс</li>
      <li>✅ Поддержка по запросам</li>
      <li>✅ Графики и отчёты по заказам</li>
    </ul>
  </section>

  <section id="form">
    <h2>Форма заявки</h2>
    <form action="https://formspree.io/f/mnqepvjg" method="POST">
      <input type="text" name="company" placeholder="Название компании" required>
      <input type="text" name="name" placeholder="Контактное лицо" required>
      <input type="tel" name="phone" placeholder="Телефон" required>
      <input type="email" name="email" placeholder="Email" required>
      <button type="submit">Отправить заявку</button>
    </form>
  </section>

  <footer>
    <p>© 2025 My Car Parts</p>
  </footer>
</body>
</html>
